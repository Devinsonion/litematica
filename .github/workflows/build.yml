# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [ pull_request, push ]

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [ 25 ]
        distro: [ temurin ]
        # and run on both Linux and Windows
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: checkout malilib 26.3
        uses: actions/checkout@v6
        with:
          repository: sakura-ryoko/malilib
          ref: 26.3
          path: malilib-src

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distro }}
          java-version: ${{ matrix.java }}

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/dev' }}

      - name: make gradle wrappers executable
        if: ${{ runner.os != 'Windows' }}
        run: |
          chmod +x ./gradlew
          chmod +x ./malilib-src/gradlew

      - name: build malilib 26.3
        run: ./gradlew build
        working-directory: malilib-src

      - name: build litematica
        shell: bash
        run: |
          MALILIB_JAR=$(find "$GITHUB_WORKSPACE/malilib-src/build/libs" -maxdepth 1 -type f -name 'malilib-fabric-26.3-*.jar' ! -name '*-sources.jar' | head -n 1)
          if [ -z "$MALILIB_JAR" ]; then
            echo "Could not find the built MaLiLib 26.3 jar"
            exit 1
          fi
          echo "Using MaLiLib jar: $MALILIB_JAR"
          ./gradlew build -Pmalilib_jar="$MALILIB_JAR"

      - name: capture build artifacts
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: build/libs/
